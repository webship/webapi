webapi.settings:
  type: config_object
  label: 'Web API settings'
  mapping:
    entity_json:
      type: boolean
      label: 'Show the View JSON link in entity operations'
    bundle_docs:
      type: boolean
      label: 'Show the View API documentation link in bundle entity operations'
    auto_enabled_entity_types:
      type: sequence
      label: 'Entity types whose new bundles are exposed automatically'
      sequence:
        type: string
        label: 'Entity type machine name'
